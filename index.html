<!doctype html>
<html lang="ja" class="sv-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>切り抜きを見る</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="shorts.css">
  <style>
    [hidden] { display: none !important; } /* 下の display: flex などに負けないように（ログインのあとも前の画面が裏に残っていた） */
    .ph-start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 32px 24px; text-align: center; line-height: 1.7; }
    .ph-start h1 { font-size: 20px; margin: 0; }
    .ph-start p { margin: 0; color: #ccc; font-size: 14px; max-width: 360px; }
    .ph-start .note { font-size: 12px; color: #999; }
    .ph-err { color: #ff8a80; font-size: 13px; }
    /* 一覧（パソコンの「保存した動画」と同じ並べ方） */
    html.sv-page, html.sv-page body { height: auto; min-height: 100%; }
    body.ph-viewing { overflow: hidden; }
    .ph-head { position: sticky; top: 0; z-index: 5; padding: calc(10px + env(safe-area-inset-top)) 12px 8px; background: rgba(0, 0, 0, .92); backdrop-filter: blur(8px); border-bottom: 1px solid #222; display: flex; flex-direction: column; gap: 8px; }
    .ph-bar { display: flex; align-items: center; gap: 8px; }
    .ph-bar .sp { flex: 1; }
    .ph-title { font-size: 17px; }
    .ph-stats { font-size: 12px; color: #999; white-space: nowrap; }
    .ph-head button, .ph-head select, .ph-head input { background: #1b1b1f; color: #fff; border: 1px solid #333; border-radius: 16px; padding: 8px 12px; font-size: 14px; font-family: inherit; }
    .ph-head input { flex: 1; min-width: 0; }
    .ph-head select { max-width: 8.5em; }
    .ph-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .ph-chips::-webkit-scrollbar { display: none; }
    .ph-head .ph-chip { white-space: nowrap; flex: none; font-size: 13px; padding: 6px 12px; }
    .ph-head .ph-chip.on { background: #fff; color: #000; border-color: #fff; }
    .ph-grid { list-style: none; margin: 0; padding: 12px 12px calc(24px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 10px; }
    @media (min-width: 640px) { .ph-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); } }
    .ph-card { min-width: 0; }
    .ph-thumb { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; padding: 0; border: 0; border-radius: 10px; overflow: hidden; background: linear-gradient(135deg, #2a2b31, #17181c); cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .ph-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .3s; }
    .ph-img.on { opacity: 1; }
    .ph-thumb.vertical .ph-img { object-fit: contain; background: #000; }
    .ph-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; color: rgba(255, 255, 255, .85); text-shadow: 0 1px 6px rgba(0, 0, 0, .6); }
    .ph-img.on ~ .ph-play { opacity: 0; }
    .ph-dur { position: absolute; right: 6px; bottom: 6px; background: rgba(0, 0, 0, .7); color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 6px; font-variant-numeric: tabular-nums; }
    .ph-heart { position: absolute; left: 6px; top: 4px; color: #ff4d6d; font-size: 16px; text-shadow: 0 1px 4px rgba(0, 0, 0, .7); }
    .ph-name { margin-top: 6px; font-size: 13px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
    .ph-meta { margin-top: 2px; font-size: 11px; color: #999; }
    .ph-empty { padding: 40px 24px; text-align: center; line-height: 1.7; }
    .ph-empty p { margin: 0 0 12px; color: #ccc; }
    #viewer { position: fixed; inset: 0; z-index: 40; background: #000; }
    #viewer .sv { z-index: 1; }
    #viewer .sv-top { z-index: 3; }
    #viewer .sv-top button { font-weight: 700; }
    .sv-counter { top: calc(58px + env(safe-area-inset-top)); }
    .ph-head .ph-account { max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: none; font-size: 12px; }
    .sv-empty { flex-direction: column; }
    .sv-empty p { margin: 0 0 12px; max-width: 360px; }
    .sv-empty .note { font-size: 12px; color: #999; margin-top: 16px; }
    .sv-empty .sv-action { margin-top: 4px; }
    .ph-toast { position: fixed; left: 12px; right: 12px; top: calc(96px + env(safe-area-inset-top)); z-index: 6; margin: 0 auto; max-width: 420px; padding: 10px 14px; border-radius: 12px; background: rgba(0, 0, 0, .85); color: #ff8a80; font-size: 13px; line-height: 1.6; text-align: center; }
  </style>
</head>
<body>
  <div id="start" class="ph-start">
    <img src="icon.png" alt="" width="64" height="64">
    <h1>切り抜きアシスタント</h1>
    <p>パソコンで<b>クラウドに保存した動画</b>を、パソコンと同じフォルダ分けのまま、ショート動画のように縦スワイプで見られます。</p>
    <button id="login" class="sv-action" type="button">Google でログインして見る</button>
    <p id="status" class="note" hidden></p>
    <p id="msg" class="ph-err" hidden></p>
    <p class="note">パソコンでつないだのと同じ Google アカウントを使ってください。見るのは「切り抜きアシスタント」フォルダの動画だけです。</p>
    <p class="note"><a href="privacy.html" style="color:#aaa">プライバシーポリシー</a></p>
  </div>
  <div id="lib" hidden>
    <header id="top" class="ph-head">
      <div class="ph-bar">
        <b class="ph-title">保存した動画</b>
        <span id="lib-stats" class="ph-stats"></span>
        <span class="sp"></span>
        <button id="reload" type="button" aria-label="新しいのを読む">↻</button>
        <button id="account" class="ph-account" type="button">アカウント</button>
      </div>
      <div class="ph-bar">
        <input id="q" type="search" placeholder="名前で探す" aria-label="名前で探す" autocomplete="off">
        <select id="period" aria-label="期間">
          <option value="all">すべての期間</option>
          <option value="day">今日</option>
          <option value="week">この 7 日</option>
          <option value="month">この 30 日</option>
        </select>
        <select id="sort" aria-label="並べ替え">
          <option value="new">新しい順</option>
          <option value="old">古い順</option>
          <option value="name">名前順</option>
          <option value="size">大きい順</option>
        </select>
      </div>
      <div id="folders" class="ph-chips" hidden></div>
    </header>
    <ul id="grid" class="ph-grid"></ul>
    <div id="lib-empty" class="ph-empty" hidden></div>
  </div>
  <div id="viewer" hidden>
    <div class="sv-top"><button id="viewer-close" type="button">✕ 閉じる</button></div>
    <div id="view"></div>
  </div>
  <p id="toast" class="ph-toast" role="status" hidden></p>

  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="drive-config.js"></script>
  <script src="ts-mp4.js"></script>
  <script src="sv-enhance.js"></script>
  <script src="shorts-view.js"></script>
  <script src="phone-lib.js"></script>
  <script src="phone.js"></script>
</body>
</html>
